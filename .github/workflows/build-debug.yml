name: Build Debug APK

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit-based version number

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode dev signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            mkdir -p app/signing
            echo "$DEV_KEYSTORE_BASE64" | base64 --decode > app/signing/dev.keystore
            echo "Using the fixed dev signing key (APKs install as updates)."
          else
            echo "::warning::Secret DEV_KEYSTORE_BASE64 is not set - this APK cannot update a previously installed build."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-edge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # After the upload, so a slow or failing test run never blocks the APK
      - name: Run unit tests
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest --stacktrace
